name: n1-example3-vu
version: new

basic:
  eg: "3"
  degree: 1
  mesh_backend: netgen

initialization:
  uniform_refinements: 1

runs:
  - id: n1-uniform-vu
    strategy: uniform
    levels: 5
    formulation: regularized

  - id: n1-adaptive-vu
    strategy: adaptive
    levels: 15
    formulation: regularized
    marking:
      theta12: 0.3
      theta3: 0.3

regularization:
  gamma0: 512
  n0: 144
  mu: 0.3333333333333333

hcurl_errors:
  - reference:
      run: n1-uniform-vu
      level: final
    targets:
      - run: n1-uniform-vu
        levels: all
      - run: n1-adaptive-vu
        levels: all
