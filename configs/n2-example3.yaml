name: n2-example3

basic:
  eg: "3"
  degree: 2
  mesh_backend: netgen

initialization:
  uniform_refinements: 1

runs:
  - id: n2-adaptive
    strategy: adaptive
    levels: 8
    formulation: regularized
    marking:
      theta12: 0.5
      theta3: 0.5
  
  - id: n2-uniform
    strategy: uniform
    levels: 5
    formulation: regularized

  - id: n2-uniform-mixed
    strategy: uniform
    levels: 5
    formulation: mixed


regularization:
  gamma0: 512
  n0: 144
  mu: 0.3333333333333333

hcurl_errors:
  - reference:
      run: n2-uniform-mixed
      level: final
    targets:
      - run: n2-uniform
        levels: all
      - run: n2-adaptive
        levels: all
