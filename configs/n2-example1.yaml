name: n2-example1
basic:
  eg: "1"
  degree: 2
  mesh_backend: netgen
initialization:
  uniform_refinements: 1
runs:
  - id: n2-uniform
    strategy: uniform
    levels: 4
    formulation: regularized
  - id: n2-adaptive
    strategy: adaptive
    levels: 13
    formulation: regularized
    marking:
      theta12: 0.5
      theta3: 0.5
regularization:
  gamma0: 1024
  n0: 144
  mu: 0.3333333333333333
