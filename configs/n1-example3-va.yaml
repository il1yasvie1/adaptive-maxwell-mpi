name: n1-example3-va
version: new

basic:
  eg: "3"
  degree: 1
  mesh_backend: netgen

initialization:
  uniform_refinements: 1

runs:
  - id: n1-adaptive-va
    strategy: adaptive
    levels: 21
    formulation: regularized
    marking:
      theta12: 0.3
      theta3: 0.3
  - id: n1-uniform-va
    strategy: uniform
    levels: 5
    formulation: regularized

regularization:
  gamma0: 512
  n0: 144
  mu: 0.3333333333333333

hcurl_errors:
  - reference:
      run: n1-adaptive-va
      level: final
    targets:
      - run: n1-uniform-va
        levels: all
      - run: n1-adaptive-va
        levels: all
